<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#e21d28" />
  
  <!-- Calendar Body -->
  <rect x="26" y="32" width="48" height="44" rx="6" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
  
  <!-- Calendar Top Line -->
  <line x1="26" y1="48" x2="74" y2="48" stroke="#ffffff" stroke-width="4.5" />
  
  <!-- Calendar Bindings -->
  <line x1="36" y1="23" x2="36" y2="35" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <line x1="64" y1="23" x2="64" y2="35" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Checkmark -->
  <polyline points="40,62 48,69 62,54" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
